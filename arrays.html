<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Arrays</title>
  </head>
  <body>
    <h2>Working with Arrays</h2>
    <div id="out"></div>

    Web Technologies Lab — Department of Computer Applications
    <script>
      let colours = ["red", "blue", "green"];
      colours.push("red"); // add at end
      let msg = "Array: " + colours.join(", ") + "<br>";
      msg += "Length: " + colours.length + "<br>";
      msg += "First element: " + colours[0] + "<br><br>";
      let numbers = [10, 25, 7, 40, 15];
      let sum = 0,
        max = numbers[0];
      for (let n of numbers) {
        sum += n;
        if (n > max) max = n;
      }
      msg += "Numbers: " + numbers.join(", ") + "<br>";
      msg += "Sum = " + sum + "<br>";
      msg += "Maximum = " + max;
      document.getElementById("out").innerHTML = msg;
    </script>
  </body>
</html>
